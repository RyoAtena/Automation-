[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
zend.enable_gc = On
expose_php = On
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
error_reporting = E_ALL
display_errors = Off
log_errors = On
default_mimetype = "text/html"
default_charset = "UTF-8"
file_uploads = On
upload_max_filesize = 10M
max_file_uploads = 20
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 30

extension_dir = "C:\Users\USER\AppData\Local\Microsoft\WinGet\Packages\PHP.PHP.8.3_Microsoft.Winget.Source_8wekyb3d8bbwe\ext"
extension=curl
extension=openssl
extension=mbstring
extension=pdo_sqlite
extension=sqlite3
extension=fileinfo

[Date]
date.timezone = Asia/Jakarta

[Session]
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = NEXUS_GAMING_SESSID
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 28800
